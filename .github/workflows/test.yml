name: test

on:
  push:
  pull_request:

# The reproducibility target: a locked, boring environment where the same
# seed produces the same bytes and the full suite (PIT audit, leak
# guardrail, 20bp equal-weight pin, cost identities) must pass.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pin the exact versions the suite was developed against
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "numpy==2.5.4" "pandas==2.3.3" "scipy==1.18.1" \
                     "scikit-learn==1.9.1" "lightgbm==4.7.0" \
                     "pyarrow==26.0.0" "matplotlib==3.11.2" \
                     "pyyaml==6.0.3" "pytest==9.1.1"
      - name: Run the suite
        run: python -m pytest -q
      - name: Regenerate the research note (determinism check)
        run: PYTHONPATH=src python -m alpha.run --config configs/default.yaml
